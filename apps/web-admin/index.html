<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>绥安食品 · 商户管理后台</title>
  <link rel="icon" href="../wechat-miniprogram/assets/emblem.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
      <div class="side-brand">
        <span class="side-logo"><img src="../wechat-miniprogram/assets/emblem.png" alt="绥安食品"></span>
        <div>
          <div class="bt">绥安食品</div>
          <div class="bs">商户管理后台</div>
        </div>
      </div>
      <nav class="side-scroll" id="side-nav"></nav>
      <div class="side-foot">
        P0 演示原型 · 本地演示数据<br>与小程序端数据不互通，正式期由后端打通
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="grow">
          <span class="tb-title" id="tb-title">工作台</span>
          <span class="tb-sub" id="tb-sub"></span>
        </div>
        <span class="pill" id="tb-status"></span>
        <div class="acct">
          <button class="acct-btn" id="acct-btn">
            <span class="acct-av">高</span>
            <span class="acct-nm">高特</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8f9384" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="acct-pop" id="acct-pop"></div>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="toast-host" id="toast-host"></div>
  <div id="overlay-host"></div>

  <!-- 数据层（契约与签名同 apps/wechat-miniprogram/utils/api.js） -->
  <script src="data/xlsx.js"></script>
  <script src="data/seed.js"></script>
  <script src="data/api.js"></script>

  <!-- 通用 UI -->
  <script src="ui/icons.js"></script>
  <script src="ui/toast.js"></script>
  <script src="ui/modal.js"></script>
  <script src="ui/drawer.js"></script>
  <script src="ui/table.js"></script>
  <script src="ui/import-flow.js"></script>

  <!-- 页面 -->
  <script src="pages/dashboard.js"></script>
  <script src="pages/orders.js"></script>
  <script src="pages/verify.js"></script>
  <script src="pages/products.js"></script>
  <script src="pages/product-import.js"></script>
  <script src="pages/categories.js"></script>
  <script src="pages/staff.js"></script>
  <script src="pages/staff-import.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/layer.js"></script>

  <!-- 路由与启动 -->
  <script src="app.js"></script>
</body>
</html>
